<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3D Тур — Кванториум 3 этаж</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="intro">
  <div id="intro-effects">
    <div class="bg-shape s1"></div>
    <div class="bg-shape s2"></div>
    <div class="bg-shape s3"></div>
    <div class="bg-shape s4"></div>
    <div class="bg-shape s5"></div>
    <div class="bg-shape s6"></div>
    <div class="bg-shape s7"></div>
    <div class="bg-shape s8"></div>
  </div>
  <div id="intro-gradient"></div>
  <div id="intro-letters" aria-label="Кванториум">
    <span>К</span><span>в</span><span>а</span><span>н</span><span>т</span>
    <span>о</span><span>р</span><span>и</span><span>у</span><span>м</span>
  </div>
  <div id="intro-sub">3D Тур — 3 этаж</div>
</div>

<div id="progress-overlay" class="hidden">
  <div id="progress-inner">
    <div id="progress-header">
      <span id="progress-text">Загрузка… 0%</span>
    </div>
    <div id="progress-track"><div id="progress-bar"></div></div>
    <div id="progress-files"></div>
  </div>
</div>

<div id="sidebar-btn">☰</div>

<div id="sidebar">
  <div id="sidebar-header">
    <span id="sidebar-title">Комнаты</span>
    <span id="settings-btn" title="Настройки">⚙</span>
  </div>
  <div id="sidebar-list"></div>
  <div id="settings-panel" class="hidden"></div>
</div>

<div id="overlay"></div>

<div id="ui">
  <div id="scene-name"></div>
  <div id="variants"></div>
</div>

<div id="crosshair">+</div>

<script type="module" src="app.js"></script>
</body>
</html>
